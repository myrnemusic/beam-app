    background:
      radial-gradient(120% 80% at 50% 0%, var(--wine-glow) 0%, transparent 60%),
      radial-gradient(90% 60% at 50% 110%, #52161d 0%, transparent 70%),
      var(--wine-deep);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* slow breathing light behind the card */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background: radial-gradient(40% 35% at 50% 40%, rgba(255, 190, 170, 0.14), transparent 70%);
    animation: breathe 9s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  main {
    position: relative;
    width: 100%;
    max-width: 400px;
    text-align: center;
    animation: rise .9s cubic-bezier(.2, .7, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .icon {
    width: 112px; height: 112px;
    border-radius: 26px;
    display: block;
    margin: 0 auto 28px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 0 1px var(--line);
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin-bottom: 14px;
  }
  h1 {
    font-family: "Blur Pro", "Inter", sans-serif;
    font-weight: 300;
    font-size: clamp(36px, 10vw, 48px);
    line-height: 1.05;
    letter-spacing: -.01em;
    margin-bottom: 16px;
  }
  h1 em { font-style: normal; }
  p.lede {
    font-family: "Alte Haas Grotesk", "Inter", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--cream-dim);
    max-width: 320px;
    margin: 0 auto 36px;
  }
  .stores { display: grid; gap: 12px; }
  .store {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--wine-deep);
    background: var(--cream);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  }
  .store:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
  .store:active { transform: translateY(0); }
  .store:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
  .store.alt {
    background: transparent;
    color: var(--cream);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .store.alt:hover { background: rgba(247, 239, 230, .06); }
  .store svg { width: 26px; height: 26px; flex: none; }
  .store span { display: flex; flex-direction: column; text-align: left; line-height: 1.15; }
  .store small { font-size: 11px; opacity: .7; }
  .store strong { font-size: 17px; font-weight: 500; letter-spacing: -.01em; }
  .store .arrow { margin-left: auto; width: 18px; height: 18px; opacity: .5; }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--cream-dim);
    letter-spacing: .04em;
  }
  @media (prefers-reduced-motion: reduce) {
    body::before, main { animation: none; }
  }
</style>
</head>
